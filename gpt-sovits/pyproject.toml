[project]
name = "my-project"
version = "0.1.0"
description = "Project migrated from requirements.txt"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy<2.0",
    "scipy",
    "tensorboard",
    "librosa==0.10.2",
    "numba",
    "pytorch-lightning>=2.4",
    "gradio<5",
    "ffmpeg-python",
    "onnxruntime; platform_machine == 'aarch64' or platform_machine == 'arm64'",
    "onnxruntime-gpu; platform_machine == 'x86_64' or platform_machine == 'AMD64'",
    "tqdm",
    "funasr>=1.3.7",
    "cn2an",
    "pypinyin",
    "pyopenjtalk>=0.4.1",
    "g2p_en",
    "modelscope",
    "sentencepiece",
    "transformers>=4.43,<=4.50",
    "peft<0.18.0",
    "chardet",
    "PyYAML",
    "psutil",
    "jieba_fast",
    "jieba",
    "split-lang",
    "fast_langdetect>=0.3.1",
    "wordsegment",
    "rotary_embedding_torch",
    "ToJyutping",
    "g2pk2",
    "ko_pron",
    "opencc",
    "python_mecab_ko; sys_platform != 'win32'",
    "fastapi[standard]>=0.115.2",
    "x_transformers",
    "torchmetrics<=1.5",
    "pydantic<=2.10.6",
    "ctranslate2>=4.0,<5",
    "av>=11",
    "jinja2==3.1.2",
    "faster-whisper",
    "torch",
    "torchaudio",
    "torchcodec",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.uv]
no-binary = ["opencc"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchcodec = { index = "pytorch-cu128" }
